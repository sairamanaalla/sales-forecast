services:

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi

    ports:
      - "8000:8000"

    env_file:
      - .env

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    ports:
      - "8501:8501"

    env_file:
      - .env
    
    environment:
      - API_URL=http://fastapi:8000

    depends_on:
      - fastapi